<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17191c">
<meta name="description" content="Simple personal money tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>Money Tracker</title>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <h1>Money Tracker</h1>
      <div class="muted" id="monthLabel">September 2026</div>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙</button>
  </header>

  <nav class="tabs">
    <button class="tab active" data-view="dashboard">Dashboard</button>
    <button class="tab" data-view="add">＋ Add</button>
    <button class="tab" data-view="history">History</button>
    <button class="tab" data-view="usage">Monthly Usage</button>
    <button class="tab" data-view="reports">Reports</button>
  </nav>

  <section id="dashboard" class="view active"></section>
  <section id="add" class="view"></section>
  <section id="history" class="view"></section>
  <section id="usage" class="view"></section>
  <section id="reports" class="view"></section>
  <section id="settings" class="view"></section>

  <div id="toast" class="toast"></div>
</div>

<script>
window.MONEY_TRACKER_CONFIG = {
  BACKEND_URL: "https://script.google.com/macros/s/AKfycby_KBB_dryzSytR2l40-c8oPQHlIJHQ5dHlr_cf1h0c3AnDCB_AfMcWY-xKy6jWyzlY/exec"
};
</script>
<script src="app.js"></script>
</body>
</html>
